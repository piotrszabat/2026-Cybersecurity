title: Suspicious PowerShell Execution
id: DET-002
status: experimental
description: Detects suspicious PowerShell execution based on process image and command-line content.
author: Piotr Szabat
date: 2026-04-01
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cmd:
    CommandLine|contains:
      - 'EncodedCommand'
      - 'Invoke-WebRequest'
      - 'IEX'
      - 'DownloadString'
  condition: selection_img and selection_cmd
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
level: high
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001