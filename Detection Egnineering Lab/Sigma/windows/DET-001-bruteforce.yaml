title: Multiple Failed Logon Attempts
id: DET-001
status: experimental
description: Detects repeated failed logon attempts that may indicate brute force or password spraying activity.
author: Piotr Szabat
date: 2026-04-01
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
fields:
  - TargetUserName
  - IpAddress
  - WorkstationName
  - ComputerName
level: medium
tags:
  - attack.credential_access
  - attack.t1110